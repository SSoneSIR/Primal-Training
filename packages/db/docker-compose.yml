name: primal-training

services:
  postgres:
    image: postgres:16
    container_name: primal-training-postgres
    environment:
      POSTGRES_DB: primal_training
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - primal_training_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  primal_training_postgres_data:
